<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Aave</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Aave">
<script>
  (function () {
    var t = localStorage.getItem('aave.theme') || 'auto';
    if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="lock.js"></script>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--soft:#eeeef1;--text:#18181b;--mute:#6b6b73;--faint:#9a9ba1;--line:#e3e3e7;
  --green:#1a7f4b;--green-bg:#e3f4ea;--amber:#9a5b00;--amber-bg:#fdf0d9;--red:#c62828;--red-bg:#fde6e6;
  --blue:#1f5fbf;--blue-bg:#e5eefb;--bar:#d9d9de;--accent:#18181b;--on-accent:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214;--card:#1c1d20;--soft:#25262a;--text:#f2f2f3;--mute:#a1a2a8;--faint:#75767c;--line:#2c2d31;
    --green:#5fd394;--green-bg:#183626;--amber:#f2b552;--amber-bg:#3a2c12;--red:#ff7b7b;--red-bg:#3d1c1c;
    --blue:#7fb1ff;--blue-bg:#1a2a44;--bar:#34353a;--accent:#f2f2f3;--on-accent:#111214;
  }
}
:root[data-theme="dark"]{
  --bg:#111214;--card:#1c1d20;--soft:#25262a;--text:#f2f2f3;--mute:#a1a2a8;--faint:#75767c;--line:#2c2d31;
  --green:#5fd394;--green-bg:#183626;--amber:#f2b552;--amber-bg:#3a2c12;--red:#ff7b7b;--red-bg:#3d1c1c;
  --blue:#7fb1ff;--blue-bg:#1a2a44;--bar:#34353a;--accent:#f2f2f3;--on-accent:#111214;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;width:100%;overscroll-behavior-x:none;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{touch-action:pan-y pinch-zoom;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand{flex:1;display:flex;align-items:center;gap:9px;font-size:20px;font-weight:700;letter-spacing:-.01em}.brand img{border-radius:8px}
.ib{width:38px;height:38px;border-radius:10px;border:none;background:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib svg{width:19px;height:19px}
.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 .5px var(--line)}
.lbl{font-size:12px;color:var(--mute)}
.big{font-size:clamp(16px,5.2vw,21px);white-space:nowrap;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mute);margin-top:1px}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 0 0 .5px var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ct{font-weight:600;font-size:15px}
.cw{font-size:12px;color:var(--faint);font-weight:400;margin-left:4px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;white-space:nowrap}
.ok{background:var(--green-bg);color:var(--green)}.warn{background:var(--amber-bg);color:var(--amber)}.bad{background:var(--red-bg);color:var(--red)}.info{background:var(--blue-bg);color:var(--blue)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mute);margin-left:6px;font-weight:500}
.bar{height:6px;background:var(--bar);border-radius:3px;overflow:hidden;margin:2px 0 5px}.bar i{display:block;height:100%;border-radius:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 0;border-top:.5px solid var(--line)}
.row:first-of-type{border-top:none}
.r{text-align:right;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.side{font-size:11px;color:var(--faint);display:block}
.note{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:7px 9px;border-radius:9px;margin-top:6px}
.note svg{width:15px;height:15px;flex:none;margin-top:1px}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:12px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:2px}
.seg button{flex:1;border:none;background:none;padding:7px 4px;border-radius:7px;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 0 0 .5px var(--line)}
input[type=number],input[type=text],input[type=password],select,textarea{background:var(--soft);border:1px solid transparent;border-radius:9px;padding:8px 10px;font-size:16px;outline:none;max-width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--faint)}
input[type=number]{width:76px;text-align:right}
textarea{width:100%;min-height:84px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.tg{width:44px;height:26px;border-radius:13px;background:var(--bar);position:relative;border:none;cursor:pointer;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg.on{background:#34c759}.tg.on::after{left:21px}
.sec{font-size:13px;color:var(--mute);margin:18px 4px 6px;font-weight:500}
.btn{width:100%;padding:12px;border-radius:11px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;cursor:pointer}
.btn2{width:100%;padding:11px;border-radius:11px;border:none;background:var(--soft);color:var(--text);font-size:15px;cursor:pointer;margin-top:8px}
.msg{font-size:13px;margin-top:8px;text-align:center;min-height:18px}.msg.warn{padding:8px 10px;border-radius:9px}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:22px 10px}
.hf2{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px;padding:6px 0}
.hf2 span.h{font-size:11px;color:var(--faint);text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:none;background:var(--soft);color:var(--mute);font-size:14px;padding:8px 14px;border-radius:18px;cursor:pointer;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.wf{background:var(--soft);border-radius:11px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.wf input{background:var(--card);width:100%}
.wrow{display:flex;gap:6px;align-items:center}
.wrow .addr{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ib.sm{width:38px;height:38px;background:var(--card);color:var(--red)}
.row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch .ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note span{min-width:0;overflow-wrap:anywhere}
#view,.card,.metric{min-width:0;max-width:100%}
.skel{height:84px;border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line);margin-bottom:10px;opacity:.6}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><span>Aave</span></div>
  <button class="ib" id="btnRefresh" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg></button>
  <button class="ib" id="btnSettings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
<main id="view"></main>
<script type="module" src="app.js"></script>
</body>
</html>
